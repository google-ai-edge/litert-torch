version: 2 # zizmor: ignore[dependabot-cooldown] # zizmor: ignore[dependabot-cooldown]
updates:
  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 30

  # Maintain dependencies for pip
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps): "
    cooldown:
      default-days: 30
