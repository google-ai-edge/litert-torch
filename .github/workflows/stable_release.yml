# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/

name: Build and Release (stable)

on:
  workflow_dispatch:  # Allow manual triggers for stable releases
    inputs:
      dry_run:
        description: 'When true, wheels will not be published to PyPI.'
        required: true
        default: true
        type: boolean

jobs:
  run-unittests-python:
    name: Unit Tests Python
    uses: ./.github/workflows/unittests_python.yml
    with:
      trigger-sha: ${{ github.sha }}

  build-stable:
    needs: run-unittests-python
    name: Build and Release litert-torch
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install python-build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel
          python -m pip list

      - name: Build the wheel
        run: |
          python setup.py bdist_wheel

      - name: Verify the distribution
        run: twine check --strict dist/*

      - name: List the contents of litert_torch wheel
        run: python -m zipfile --list dist/*.whl

      - name: Upload Stable Wheel
        uses: actions/upload-artifact@v4
        with:
          name: litert-torch-wheel
          path: dist/*.whl

  test-before-publish:
    needs: build-stable
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import litert-torch (No TF)
    runs-on:
      labels: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Stable Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-torch-wheel
          path: /tmp/dist

      - name: Install litert-torch
        run: |
          python -m pip install /tmp/dist/*.whl

      - name: Import litert-torch and export_hf from /tmp
        working-directory: /tmp
        run: |
          python -c "import litert_torch; from litert_torch.generative.export_hf import export"

  test-export-hf-v2-wheel:
    needs: build-stable
    name: Test export_hf Converter V2 on Built Stable Wheel
    runs-on:
      labels: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Stable Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-torch-wheel
          path: /tmp/dist

      - name: Install Stable Wheel and tf-nightly
        run: |
          python -m pip install /tmp/dist/*.whl
          python -m pip install --pre tf-nightly

      - name: Run Tiny Qwen3 Converter V2 Export and LiteRT Inference
        working-directory: /tmp
        run: |
          python - << 'EOF'
          import torch
          import transformers
          from litert_torch.generative.export_hf.model_ext import builtin_extensions
          from litert_torch.generative.export_hf.model_ext import testing as ext_testing

          torch.manual_seed(0)
          ext = builtin_extensions.Qwen3Extension()
          cfg = transformers.Qwen3Config(
              vocab_size=64,
              hidden_size=32,
              intermediate_size=64,
              num_hidden_layers=2,
              num_attention_heads=2,
              num_key_value_heads=2,
              head_dim=16,
              max_position_embeddings=64,
          )
          with ext.patch_context():
            model = transformers.Qwen3ForCausalLM(cfg).eval()
          sigs = ext_testing.assert_tiny_v2_export(
              ext=ext,
              model=model,
              target="cpu_gpu",
              export_kwargs={"externalize_embedder": True},
              max_tensor_rank=4,
          )
          assert "model.tflite" in sigs and "embedder.tflite" in sigs, sigs
          EOF

  publish-stable:
    name: Publish to PyPI
    needs: [test-before-publish, test-export-hf-v2-wheel]
    if: success() && inputs.dry_run == false
    runs-on: ubuntu-latest
    steps:
      - name: Download Stable Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-torch-wheel
          path: ./dist

      - name: Publish to PyPI
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_UPLOAD_TOKEN }}
        run: twine upload --skip-existing --non-interactive --verbose dist/*.whl

  test-after-publish:
    needs: publish-stable
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import litert-torch from PyPI
    runs-on:
      labels: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install litert-torch from PyPI
        run: |
          python -m pip install litert-torch

      - name: Import litert-torch from /tmp
        working-directory: /tmp
        run: |
          python -c "import litert_torch; from litert_torch.generative.export_hf import export"
