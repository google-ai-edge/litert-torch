# Helpful YAML parser to clarify YAML syntax:
# https://yaml-online-parser.appspot.com/

name: Build and Release (nightly)

on:
  schedule:
    # 10 am UTC is 3am or 4am PT depending on daylight savings.
    - cron: "0 10 * * *"

  workflow_dispatch: {}

jobs:
  run-unittests-python:
    if: |
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'schedule' && github.repository == 'google-ai-edge/litert-torch')

    name: Unit Tests Python
    uses: ./.github/workflows/unittests_python.yml
    with:
      trigger-sha: ${{ github.sha }}
      # TODO(cnchan): Re-enable once the tf-nightly pywrap issue is fixed.
      run-on-macos: false

  build-nightly:
    needs: run-unittests-python
    runs-on: ubuntu-latest

    name: Build litert-torch-nightly Wheel
    steps:
      - uses: actions/checkout@v4

      - name: Get and set nightly date
        id: date
        run: |
          DATE=$(date +'%Y%m%d')
          echo "NIGHTLY_RELEASE_DATE=${DATE}" >> $GITHUB_ENV
          echo "date=${DATE}" >> $GITHUB_OUTPUT

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install python-build and twine
        run: |
          python -m pip install --upgrade pip
          python -m pip install build twine wheel
          python -m pip list

      - name: Build the wheel
        run: |
          python setup.py bdist_wheel

      - name: Verify the distribution
        run: twine check --strict dist/*

      - name: List the contents of litert_torch wheel
        run: python -m zipfile --list dist/*.whl

      - name: Upload Nightly Wheel Artifact
        uses: actions/upload-artifact@v4
        with:
          name: litert-torch-nightly-wheel
          path: dist/*.whl

  test-before-publish:
    needs: build-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import Nightly Wheel (No TF)
    runs-on:
      labels: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Nightly Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-torch-nightly-wheel
          path: /tmp/dist

      - name: Install Nightly Wheel
        run: |
          python -m pip install --pre /tmp/dist/*.whl

      - name: Import litert-torch and export_hf from /tmp
        working-directory: /tmp
        run: |
          python -c "import litert_torch; from litert_torch.generative.export_hf import export"

  test-export-hf-v2-wheel:
    needs: build-nightly
    name: Test export_hf Converter V2 on Built Nightly Wheel
    runs-on:
      labels: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.12"

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Download Nightly Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-torch-nightly-wheel
          path: /tmp/dist

      - name: Install Nightly Wheel and tf-nightly
        run: |
          python -m pip install --pre /tmp/dist/*.whl tf-nightly

      - name: Run Tiny Qwen3 Converter V2 Export and LiteRT Inference
        working-directory: /tmp
        run: |
          python - << 'EOF'
          import torch
          import transformers
          from litert_torch.generative.export_hf.model_ext import builtin_extensions
          from litert_torch.generative.export_hf.model_ext import testing as ext_testing

          torch.manual_seed(0)
          ext = builtin_extensions.Qwen3Extension()
          cfg = transformers.Qwen3Config(
              vocab_size=64,
              hidden_size=32,
              intermediate_size=64,
              num_hidden_layers=2,
              num_attention_heads=2,
              num_key_value_heads=2,
              head_dim=16,
              max_position_embeddings=64,
          )
          with ext.patch_context():
            model = transformers.Qwen3ForCausalLM(cfg).eval()
          sigs = ext_testing.assert_tiny_v2_export(
              ext=ext,
              model=model,
              target="cpu_gpu",
              export_kwargs={"externalize_embedder": True},
              max_tensor_rank=4,
          )
          assert "model.tflite" in sigs and "embedder.tflite" in sigs, sigs
          EOF

  publish-nightly:
    needs: [test-before-publish, test-export-hf-v2-wheel]
    runs-on: ubuntu-latest
    name: Publish litert-torch-nightly to PyPI
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install twine
        run: |
          python -m pip install --upgrade pip twine

      - name: Download Nightly Wheel
        uses: actions/download-artifact@v4
        with:
          name: litert-torch-nightly-wheel
          path: ./dist

      - name: Upload to PyPI
        run: twine upload dist/* --non-interactive -p ${{ secrets.PYPI_UPLOAD_TOKEN }}

  run-pip-install-and-import-test:
    needs: publish-nightly
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    name: Test Install and Import litert-torch-nightly from PyPI
    runs-on:
      labels: linux-x86-n4-16
    container:
      image: us-docker.pkg.dev/ml-oss-artifacts-published/ml-public-container/ml-build:latest
    steps:
      - uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}

      - run: |
          python -m pip cache purge
          python -m pip install --upgrade pip

      - name: Install litert-torch-nightly
        run: |
          python -m pip install --pre litert-torch-nightly

      - name: Import litert-torch from /tmp
        working-directory: /tmp
        run: |
          python -c "import litert_torch; from litert_torch.generative.export_hf import export"
